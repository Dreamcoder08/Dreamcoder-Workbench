name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.14"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check src/ tests/

      - name: Format check (ruff)
        run: ruff format --check src/ tests/

      - name: Type check (mypy)
        run: mypy src/

      - name: Shell check
        run: shellcheck --shell=bash --severity=warning scripts/*.sh

      - name: Run tests
        run: python -m pytest tests/ -v --tb=short

      - name: Coverage
        run: python -m pytest tests/ --cov=dreamcoder_theme --cov-fail-under=80

      - name: Run theme health check
        env:
          PYTHONPATH: src
        run: python scripts/verify-theme-health.py

      - name: Generate theme preview
        run: python scripts/generate-theme-preview.py

      - name: Check for uncommitted changes
        run: |
          git diff --exit-code docs/generated/dreamcoder-theme-preview.md || (echo "::error::Theme preview not regenerated" && exit 1)

  integrity:
    name: Git object store integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Verify object store
        run: git fsck --full --no-progress --no-dangling

  # publish job removed — use Release workflow for PyPI publishing
