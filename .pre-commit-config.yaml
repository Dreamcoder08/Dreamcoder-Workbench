repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.2
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.3.0
    hooks:
      - id: mypy
        args: [--config-file=pyproject.toml, src]
        additional_dependencies: [PyQt6-stubs, types-jsonschema]
        pass_filenames: false

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
        args: ["--shell=bash", "--severity=warning"]
        files: ^scripts/

  - repo: local
    hooks:
      - id: pytest
        name: Run test suite
        entry: python -m pytest tests/ -q
        language: system
        files: ^(src/dreamcoder_theme/.*\.py|tests/.*\.py|DreamcoderThemes/dreamcoder/tokens(\.schema)?\.json|pyproject\.toml)$
        pass_filenames: false
      - id: validate-markdown-links
        name: Validate markdown links
        entry: python scripts/validate-markdown-links.py
        language: system
        types: [markdown]
        pass_filenames: true
      - id: dreamcoder-theme-validate
        name: Validate Dreamcoder theme tokens
        entry: env PYTHONPATH=src python scripts/verify-theme-health.py
        language: system
        files: ^(DreamcoderThemes/dreamcoder/.*\.json|DreamcoderAntigravity/.*\.json|src/dreamcoder_theme/.*|scripts/(verify-theme-health|generate-dark-css)\.py)$
        pass_filenames: false
      - id: dreamcoder-preview-regenerate
        name: Regenerate theme preview
        entry: python scripts/generate-theme-preview.py && git diff --quiet --exit-code docs/generated/dreamcoder-theme-preview.md
        language: system
        files: ^(DreamcoderThemes/dreamcoder/.*\.json|src/dreamcoder_theme/.*|scripts/generate-theme-preview\.py)$
        pass_filenames: false
      - id: ml4w-profile-validate
        name: Validate ML4W profile JSON files
        entry: python3 scripts/validate-ml4w-profiles.py --ci
        language: system
        files: ^DreamcoderProfiles/dreamcoder/.*\.json$
        pass_filenames: false
