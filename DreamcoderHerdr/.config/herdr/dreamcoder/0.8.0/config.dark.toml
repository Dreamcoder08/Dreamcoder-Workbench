# Managed by Dreamcoder; repository variant only.
[theme]
name = "catppuccin"

[theme.custom]
accent = "#a7b5fd"
panel_bg = "#000000"
surface0 = "#090909"
surface1 = "#121212"
surface_dim = "#090909"
overlay0 = "#777777"
overlay1 = "#a4a4a4"
text = "#ebebeb"
subtext0 = "#dcdcdc"
mauve = "#f59ac5"
green = "#86cf90"
yellow = "#dcb55e"
red = "#fc9d95"
blue = "#76c4f6"
teal = "#6eccd1"
peach = "#c6d0fd"

[ui]
accent = "#6FA0AF"
pane_scrollbars = false

[keys]
prefix = "ctrl+a"
previous_agent = "prefix+alt+k"
next_agent = "prefix+alt+j"
focus_agent = "prefix+ctrl+1..9"
