# Managed by Dreamcoder; repository variant only.
[theme]
name = "catppuccin"

[theme.custom]
accent = "#A5B4FC"
panel_bg = "#000000"
surface0 = "#0B0B0B"
surface1 = "#0D0D0F"
surface_dim = "#0B0B0B"
overlay0 = "#767676"
overlay1 = "#A7A7A7"
text = "#E6E6E6"
subtext0 = "#C7C7C7"
mauve = "#D8B4FE"
green = "#34D399"
yellow = "#FBBF24"
red = "#FB8585"
blue = "#7DD3FC"
teal = "#3B82F6"
peach = "#D4B5FD"
sidebar_bg = "#000000"
active_row_bg = "#0B0B0B"
selection_bg = "#3A3A3A"

[ui]
accent = "#6FA0AF"
pane_scrollbars = false

[keys]
prefix = "ctrl+a"
previous_agent = "prefix+alt+k"
next_agent = "prefix+alt+j"
focus_agent = "prefix+ctrl+1..9"
