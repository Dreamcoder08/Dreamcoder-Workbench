# Managed by Dreamcoder; repository variant only.
[theme]
name = "catppuccin-latte"

[theme.custom]
accent = "#8c4d04"
panel_bg = "#f5ede2"
surface0 = "#fefaf2"
surface1 = "#eadcc9"
surface_dim = "#eadfcf"
overlay0 = "#695745"
overlay1 = "#5a4d41"
text = "#1c1611"
subtext0 = "#3d352c"
mauve = "#853361"
green = "#215d27"
yellow = "#724800"
red = "#902822"
blue = "#08557e"
teal = "#00616a"
peach = "#af4318"
sidebar_bg = "#f5ede2"
