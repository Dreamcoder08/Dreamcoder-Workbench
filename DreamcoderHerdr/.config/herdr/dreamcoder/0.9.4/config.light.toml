# Managed by Dreamcoder; repository variant only.
[theme]
name = "catppuccin-latte"

[theme.custom]
accent = "#874004"
panel_bg = "#f9f6f2"
surface0 = "#fefdfa"
surface1 = "#ede9e3"
surface_dim = "#f2eee9"
overlay0 = "#5f544c"
overlay1 = "#4f463e"
text = "#1e1813"
subtext0 = "#2b241e"
mauve = "#81386b"
green = "#1b672f"
yellow = "#6e5201"
red = "#9c2024"
blue = "#0a5b8f"
teal = "#016367"
peach = "#753100"
sidebar_bg = "#f2eee9"
active_row_bg = "#f1d7c1"
selection_bg = "#f1d7c1"

[ui]
accent = "#874004"
pane_scrollbars = false

[keys]
prefix = "ctrl+a"
previous_agent = "prefix+alt+k"
next_agent = "prefix+alt+j"
focus_agent = "prefix+ctrl+1..9"
