# Dreamcoder Dark — Lazygit theme
# https://github.com/jesseduffield/lazygit/blob/master/docs/Config.md

gui:
  theme:
    activeBorderColor:
      - "#a7b5fd" # accent
      - "bold"
    inactiveBorderColor:
      - "#636363" # border
    searchingActiveBorderColor:
      - "#c6d0fd" # accent-2
      - "bold"
    optionsTextColor:
      - "#76c4f6" # diagnostic
    selectedLineBgColor:
      - "#303030" # selection
    inactiveViewSelectedLineBgColor:
      - "#1c1c1c" # surface-2
    cherryPickedCommitFgColor:
      - "#76c4f6"
    cherryPickedCommitBgColor:
      - "#c6d0fd"
    markedBaseCommitFgColor:
      - "#76c4f6"
    markedBaseCommitBgColor:
      - "#a7b5fd"
    unstagedChangesColor:
      - "#fc9d95" # error
    defaultFgColor:
      - "#e0e0e0" # text
  authorColors:
        "#a7b5fd": "#000000"
        "#c6d0fd": "#000000"
        "#76c4f6": "#000000"
        "#86cf90": "#000000"
        "#d6a2f6": "#000000"
        "#f59ac5": "#000000"
  showFileTree: true
  showRandomTip: false
  nerdFontsVersion: "3"
  sidePanelWidth: 0.3
  expandFocusedSidePanel: true
  mainPanelSplitMode: "flexible"
  language: "en"
git:
  diffRenderers:
    - colorArg: always
      command: delta --syntax-theme "Catppuccin Mocha" --paging=never
  merging:
    manualCommit: false
  skipHookPrefix: WIP
  autoFetch: true
  autoRefresh: true
  branchLogCmd: "git log --graph --pretty=format:'%C(#a7b5fd)%h%Creset -%C(#c6d0fd)%d%Creset %s %C(#c5c5c5)(%cr) %C(#76c4f6)<%an>%Creset' --date=relative"
update:
  method: never
