# Dreamcoder Light — Lazygit theme
# https://github.com/jesseduffield/lazygit/blob/master/docs/Config.md

gui:
  theme:
    activeBorderColor:
      - "#8c4d04" # accent
      - "bold"
    inactiveBorderColor:
      - "#9f8f7d" # border
    searchingActiveBorderColor:
      - "#af4318" # accent-2
      - "bold"
    optionsTextColor:
      - "#08557e" # diagnostic
    selectedLineBgColor:
      - "#eadcc9" # selection
    inactiveViewSelectedLineBgColor:
      - "#d5c1a9" # surface-2
    cherryPickedCommitFgColor:
      - "#08557e"
    cherryPickedCommitBgColor:
      - "#af4318"
    markedBaseCommitFgColor:
      - "#08557e"
    markedBaseCommitBgColor:
      - "#8c4d04"
    unstagedChangesColor:
      - "#902822" # error
    defaultFgColor:
      - "#1c1611" # text
  authorColors:
        "#8c4d04": "#f5ede2"
        "#af4318": "#f5ede2"
        "#08557e": "#f5ede2"
        "#215d27": "#f5ede2"
        "#594399": "#f5ede2"
        "#853361": "#f5ede2"
  showFileTree: true
  showRandomTip: false
  nerdFontsVersion: "3"
  sidePanelWidth: 0.3
  expandFocusedSidePanel: true
  mainPanelSplitMode: "flexible"
  language: "en"
git:
  diffRenderers:
    - colorArg: always
      command: delta --syntax-theme "Catppuccin Latte" --paging=never
  merging:
    manualCommit: false
  skipHookPrefix: WIP
  autoFetch: true
  autoRefresh: true
  branchLogCmd: "git log --graph --pretty=format:'%C(#8c4d04)%h%Creset -%C(#af4318)%d%Creset %s %C(#796755)(%cr) %C(#08557e)<%an>%Creset' --date=relative"
update:
  method: never
