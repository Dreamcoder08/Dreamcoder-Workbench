# Dreamcoder Light — Lazygit theme
# https://github.com/jesseduffield/lazygit/blob/master/docs/Config.md

gui:
  theme:
    activeBorderColor:
      - "#8b440c" # accent
      - "bold"
    inactiveBorderColor:
      - "#8e8479" # border
    searchingActiveBorderColor:
      - "#a73b15" # accent-2
      - "bold"
    optionsTextColor:
      - "#005f8e" # diagnostic
    selectedLineBgColor:
      - "#f1d7c2" # selection
    inactiveViewSelectedLineBgColor:
      - "#e3ddd4" # surface-2
    cherryPickedCommitFgColor:
      - "#005f8e"
    cherryPickedCommitBgColor:
      - "#a73b15"
    markedBaseCommitFgColor:
      - "#005f8e"
    markedBaseCommitBgColor:
      - "#8b440c"
    unstagedChangesColor:
      - "#a12623" # error
    defaultFgColor:
      - "#1e1814" # text
  authorColors:
        "#8b440c": "#f9f6f2"
        "#a73b15": "#f9f6f2"
        "#005f8e": "#f9f6f2"
        "#1c6c31": "#f9f6f2"
        "#5b4c99": "#f9f6f2"
        "#853c70": "#f9f6f2"
  showFileTree: true
  showRandomTip: false
  nerdFontsVersion: "3"
  sidePanelWidth: 0.3
  expandFocusedSidePanel: true
  mainPanelSplitMode: "flexible"
  language: "en"
git:
  diffRenderers:
    - colorArg: always
      command: delta --syntax-theme "Catppuccin Latte" --paging=never
  merging:
    manualCommit: false
  skipHookPrefix: WIP
  autoFetch: true
  autoRefresh: true
  branchLogCmd: "git log --graph --pretty=format:'%C(#8b440c)%h%Creset -%C(#a73b15)%d%Creset %s %C(#675d53)(%cr) %C(#005f8e)<%an>%Creset' --date=relative"
update:
  method: never
