# Dreamcoder Light — Lazygit theme
# https://github.com/jesseduffield/lazygit/blob/master/docs/Config.md

gui:
  theme:
    activeBorderColor:
      - "#874004" # accent
      - "bold"
    inactiveBorderColor:
      - "#908379" # border
    searchingActiveBorderColor:
      - "#753100" # accent-2
      - "bold"
    optionsTextColor:
      - "#0a5b8f" # diagnostic
    selectedLineBgColor:
      - "#f1d7c1" # selection
    inactiveViewSelectedLineBgColor:
      - "#e3ddd5" # surface-2
    cherryPickedCommitFgColor:
      - "#0a5b8f"
    cherryPickedCommitBgColor:
      - "#753100"
    markedBaseCommitFgColor:
      - "#0a5b8f"
    markedBaseCommitBgColor:
      - "#874004"
    unstagedChangesColor:
      - "#9c2024" # error
    defaultFgColor:
      - "#1e1813" # text
  authorColors:
        "#874004": "#f9f6f2"
        "#753100": "#f9f6f2"
        "#0a5b8f": "#f9f6f2"
        "#1b672f": "#f9f6f2"
        "#574894": "#f9f6f2"
        "#81386b": "#f9f6f2"
  showFileTree: true
  showRandomTip: false
  nerdFontsVersion: "3"
  sidePanelWidth: 0.3
  expandFocusedSidePanel: true
  mainPanelSplitMode: "flexible"
  language: "en"
git:
  diffRenderers:
    - colorArg: always
      command: delta --syntax-theme "Catppuccin Latte" --paging=never
  merging:
    manualCommit: false
  skipHookPrefix: WIP
  autoFetch: true
  autoRefresh: true
  branchLogCmd: "git log --graph --pretty=format:'%C(#874004)%h%Creset -%C(#753100)%d%Creset %s %C(#5f544c)(%cr) %C(#0a5b8f)<%an>%Creset' --date=relative"
update:
  method: never
