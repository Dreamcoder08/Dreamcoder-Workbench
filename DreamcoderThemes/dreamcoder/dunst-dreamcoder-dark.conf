# ========================================================
# Dreamcoder Dark — Dunst theme
# ========================================================
# Include from dunstrc:
#   [include] dreamcoder-dunst.conf

[urgency_low]
    background = "#000000"
    foreground = "#e0e0e0"
    highlight = "#a7b5fd"
    frame_color = "#636363"

[urgency_normal]
    background = "#090909"
    foreground = "#e0e0e0"
    highlight = "#a7b5fd"
    frame_color = "#777777"

[urgency_critical]
    background = "#4c2f2d"
    foreground = "#e0e0e0"
    highlight = "#fc9d95"
    frame_color = "#fc9d95"
