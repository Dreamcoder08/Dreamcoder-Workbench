# ========================================================
# Dreamcoder Light — Dunst theme
# ========================================================
# Include from dunstrc:
#   [include] dreamcoder-dunst.conf

[urgency_low]
    background = "#f9f6f2"
    foreground = "#1e1813"
    highlight = "#874004"
    frame_color = "#908379"

[urgency_normal]
    background = "#fefdfa"
    foreground = "#1e1813"
    highlight = "#874004"
    frame_color = "#5f544c"

[urgency_critical]
    background = "#ddb6b4"
    foreground = "#1e1813"
    highlight = "#9c2024"
    frame_color = "#9c2024"
