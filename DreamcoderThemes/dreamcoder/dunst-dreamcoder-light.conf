# ========================================================
# Dreamcoder Light — Dunst theme
# ========================================================
# Include from dunstrc:
#   [include] dreamcoder-dunst.conf

[urgency_low]
    background = "#f9f6f2"
    foreground = "#1e1814"
    highlight = "#8b440c"
    frame_color = "#8e8479"

[urgency_normal]
    background = "#fefdfa"
    foreground = "#1e1814"
    highlight = "#8b440c"
    frame_color = "#645c53"

[urgency_critical]
    background = "#dfb8b4"
    foreground = "#1e1814"
    highlight = "#a12623"
    frame_color = "#a12623"
