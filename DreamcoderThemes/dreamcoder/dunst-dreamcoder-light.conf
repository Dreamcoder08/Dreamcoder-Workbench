# ========================================================
# Dreamcoder Light — Dunst theme
# ========================================================
# Include from dunstrc:
#   [include] dreamcoder-dunst.conf

[urgency_low]
    background = "#f5ede2"
    foreground = "#1c1611"
    highlight = "#8c4d04"
    frame_color = "#9f8f7d"

[urgency_normal]
    background = "#fefaf2"
    foreground = "#1c1611"
    highlight = "#8c4d04"
    frame_color = "#695745"

[urgency_critical]
    background = "#d7b2a8"
    foreground = "#1c1611"
    highlight = "#902822"
    frame_color = "#902822"
