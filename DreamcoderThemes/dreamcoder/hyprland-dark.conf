# Dreamcoder color layer for Hyprland.
# Import after ML4W/Gentleman defaults; this changes colors only.

general {
    col.active_border = rgba(e0e0e0ff) rgba(d2d2d2ff) 45deg
    col.inactive_border = rgba(262626d6)
    gaps_in = 4
    gaps_out = 16
}

misc {
    background_color = rgba(000000ff)
}

animations {
    enabled = true
    bezier = dc_enter, 0.22, 1, 0.36, 1
    bezier = dc_exit, 0.4, 0, 1, 1
    bezier = dc_move, 0.33, 0, 0.2, 1
    animation = windowsIn, 1, 2, dc_enter
    animation = windowsOut, 1, 1.2, dc_exit
    animation = windowsMove, 1, 2, dc_move
    animation = fadeIn, 1, 2, dc_enter
    animation = fadeOut, 1, 1.2, dc_exit
    animation = border, 1, 1.2, dc_move
    animation = workspaces, 1, 3.2, dc_move
}
