# Dreamcoder Dark — tmux dark theme
# Text-only minimal hierarchy: no blocks, no pills, no powerline.
# Source: tmux source-file ~/.config/tmux/tmux-dreamcoder-dark.conf

# Default terminal colours (truecolor)
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"
set -ga terminal-overrides '*:Ss=\E[%p1%d q:Se=\E[2 q'

# Panes
set -g pane-border-style "fg=#1F1F1F,bg=default"
set -g pane-active-border-style "fg=#3B82F6,bg=default"
set -g display-panes-colour "#A5B4FC"
set -g display-panes-active-colour "#A5B4FC"
# Semantic token for status integrations that report successful commands.
set -g @dreamcoder-success-colour "#34D399"

# ─── Minimal status bar (text-only hierarchy) ─────────
set -g status-style "bg=#0B0B0B"
set -g status-position top
set -g status-justify left
set -g status-interval 5
set -g status-left-length 60
set -g status-right-length 120

# Left: session name bold + middot separator
set -g status-left "#[fg=#E6E6E6,bold]  #S  #[fg=#C7C7C7]· "

# Window tabs — text-only, muted / accent active
set -g window-status-style "fg=#C7C7C7"
setw -g window-status-format "#I:#W "
set -g window-status-current-style "fg=#A5B4FC,bold"
setw -g window-status-current-format "#I:#W "
setw -g window-status-separator ""

# Right: path muted + time bold
set -g status-right "#[fg=#C7C7C7]#{b:pane_current_path}  #[fg=#E6E6E6,bold]%H:%M  "

# Message
set -g message-style "fg=#E6E6E6,bg=#0B0B0B"
set -g message-command-style "fg=#E6E6E6,bg=#0B0B0B"

# Mode (copy mode)
setw -g mode-style "fg=#000000,bg=#3B82F6"

# Bell
setw -g window-status-bell-style "fg=#000000,bg=#FB8585,bold"
