# Dreamcoder Light — tmux light theme
# Text-only minimal hierarchy: no blocks, no pills, no powerline.
# Source: tmux source-file ~/.config/tmux/tmux-dreamcoder-light.conf

# Default terminal colours (truecolor)
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"
set -ga terminal-overrides '*:Ss=\E[%p1%d q:Se=\E[2 q'

# Panes
set -g pane-border-style "fg=#d5c1a9,bg=default"
set -g pane-active-border-style "fg=#00616a,bg=default"
set -g display-panes-colour "#8c4d04"
set -g display-panes-active-colour "#8c4d04"
# Semantic token for status integrations that report successful commands.
set -g @dreamcoder-success-colour "#215d27"

# ─── Minimal status bar (text-only hierarchy) ─────────
set -g status-style "bg=#eadfcf"
set -g status-position top
set -g status-justify left
set -g status-interval 5
set -g status-left-length 60
set -g status-right-length 120

# Left: session name bold + middot separator
set -g status-left "#[fg=#1c1611,bold]  #S  #[fg=#3d352c]· "

# Window tabs — text-only, muted / accent active
set -g window-status-style "fg=#3d352c"
setw -g window-status-format "#I:#W "
set -g window-status-current-style "fg=#8c4d04,bold"
setw -g window-status-current-format "#I:#W "
setw -g window-status-separator ""

# Right: path muted + time bold
set -g status-right "#[fg=#3d352c]#{b:pane_current_path}  #[fg=#1c1611,bold]%H:%M  "

# Message
set -g message-style "fg=#1c1611,bg=#fefaf2"
set -g message-command-style "fg=#1c1611,bg=#fefaf2"

# Mode (copy mode)
setw -g mode-style "fg=#f5ede2,bg=#00616a"

# Bell
setw -g window-status-bell-style "fg=#f5ede2,bg=#902822,bold"
