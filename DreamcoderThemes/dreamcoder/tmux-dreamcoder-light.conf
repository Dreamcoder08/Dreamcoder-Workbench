# Dreamcoder Light — tmux light theme
# Text-only minimal hierarchy: no blocks, no pills, no powerline.
# Source: tmux source-file ~/.config/tmux/tmux-dreamcoder-light.conf

# Default terminal colours (truecolor)
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"
set -ga terminal-overrides '*:Ss=\E[%p1%d q:Se=\E[2 q'

# Panes
set -g pane-border-style "fg=#e3ddd4,bg=default"
set -g pane-active-border-style "fg=#006973,bg=default"
set -g display-panes-colour "#8b440c"
set -g display-panes-active-colour "#8b440c"
# Semantic token for status integrations that report successful commands.
set -g @dreamcoder-success-colour "#1c6c31"

# ─── Minimal status bar (text-only hierarchy) ─────────
set -g status-style "bg=#f2eee9"
set -g status-position top
set -g status-justify left
set -g status-interval 5
set -g status-left-length 60
set -g status-right-length 120

# Left: session name bold + middot separator
set -g status-left "#[fg=#1e1814,bold]  #S  #[fg=#352f29]· "

# Window tabs — text-only, muted / accent active
set -g window-status-style "fg=#352f29"
setw -g window-status-format "#I:#W "
set -g window-status-current-style "fg=#8b440c,bold"
setw -g window-status-current-format "#I:#W "
setw -g window-status-separator ""

# Right: path muted + time bold
set -g status-right "#[fg=#352f29]#{b:pane_current_path}  #[fg=#1e1814,bold]%H:%M  "

# Message
set -g message-style "fg=#1e1814,bg=#fefdfa"
set -g message-command-style "fg=#1e1814,bg=#fefdfa"

# Mode (copy mode)
setw -g mode-style "fg=#f9f6f2,bg=#006973"

# Bell
setw -g window-status-bell-style "fg=#f9f6f2,bg=#a12623,bold"
