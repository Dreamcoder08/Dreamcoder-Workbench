# ========================================================
# Dreamcoder Light — Dunst theme
# ========================================================
# Include from dunstrc:
#   [include] dreamcoder-dunst.conf

[urgency_low]
    background = "#f3eadc"
    foreground = "#17120d"
    highlight = "#824f16"
    frame_color = "#8a7358"

[urgency_normal]
    background = "#fff7ea"
    foreground = "#17120d"
    highlight = "#824f16"
    frame_color = "#66513b"

[urgency_critical]
    background = "#d2b2a5"
    foreground = "#17120d"
    highlight = "#842f24"
    frame_color = "#842f24"
