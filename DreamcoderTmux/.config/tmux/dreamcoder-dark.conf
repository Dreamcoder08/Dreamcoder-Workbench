# Dreamcoder Dark theme for Tmux
# Auto-generated from tokens.json — do not edit manually

# ─── Colors ────────────────────────────────────────────
set -g status-style "bg=#090909,fg=#e0e0e0"
set -g status-left "#[bg=#a7b5fd,fg=#000000,bold] #S #[bg=#090909,fg=#a7b5fd] "
set -g status-right "#[fg=#76c4f6]#[fg=#e0e0e0] %H:%M #[fg=#c6d0fd]%Y-%m-%d "

# Window status
setw -g window-status-format "#[fg=#c5c5c5] #I:#W "
setw -g window-status-current-format "#[bg=#1c1c1c,fg=#a7b5fd,bold] #I:#W "

# Pane borders
set -g pane-border-style "fg=#1c1c1c"
set -g pane-active-border-style "fg=#a7b5fd"

# Messages
set -g message-style "bg=#1c1c1c,fg=#e0e0e0"
set -g message-command-style "bg=#1c1c1c,fg=#e0e0e0"

# Mode (copy mode highlight)
setw -g mode-style "bg=#a7b5fd,fg=#000000"

# Bell
setw -g window-status-bell-style "bg=#fc9d95,fg=#000000"
