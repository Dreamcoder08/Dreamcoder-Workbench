# Dreamcoder Light theme for Tmux
# Auto-generated from tokens.json — do not edit manually

# ─── Colors ────────────────────────────────────────────
set -g status-style "bg=#f2eee9,fg=#1e1813"
set -g status-left "#[bg=#874004,fg=#fefdfa,bold] #S #[bg=#f2eee9,fg=#874004] "
set -g status-right "#[fg=#0a5b8f]#[fg=#1e1813] %H:%M #[fg=#753100]%Y-%m-%d "

# Window status
setw -g window-status-format "#[fg=#5f544c] #I:#W "
setw -g window-status-current-format "#[bg=#e3ddd5,fg=#874004,bold] #I:#W "

# Pane borders
set -g pane-border-style "fg=#e3ddd5"
set -g pane-active-border-style "fg=#874004"

# Messages
set -g message-style "bg=#e3ddd5,fg=#1e1813"
set -g message-command-style "bg=#e3ddd5,fg=#1e1813"

# Mode (copy mode highlight)
setw -g mode-style "bg=#874004,fg=#fefdfa"

# Bell
setw -g window-status-bell-style "bg=#9c2024,fg=#fefdfa"
