# Dreamcoder Light — tmux light theme
# Text-only minimal hierarchy: no blocks, no pills, no powerline.
# Source: tmux source-file ~/.config/tmux/tmux-dreamcoder-light.conf

# Default terminal colours (truecolor)
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"
set -ga terminal-overrides '*:Ss=\E[%p1%d q:Se=\E[2 q'

# Panes
set -g pane-border-style "fg=#c8ad89,bg=default"
set -g pane-active-border-style "fg=#0f6570,bg=default"
set -g display-panes-colour "#824f16"
set -g display-panes-active-colour "#824f16"
# Semantic token for status integrations that report successful commands.
set -g @dreamcoder-success-colour "#315b31"

# ─── Minimal status bar (text-only hierarchy) ─────────
set -g status-style "bg=#e6d7c4"
set -g status-position top
set -g status-justify left
set -g status-interval 5
set -g status-left-length 60
set -g status-right-length 120

# Left: session name bold + middot separator
set -g status-left "#[fg=#17120d,bold]  #S  #[fg=#352e22]· "

# Window tabs — text-only, muted / accent active
set -g window-status-style "fg=#352e22"
setw -g window-status-format "#I:#W "
set -g window-status-current-style "fg=#824f16,bold"
setw -g window-status-current-format "#I:#W "
setw -g window-status-separator ""

# Right: path muted + time bold
set -g status-right "#[fg=#352e22]#{b:pane_current_path}  #[fg=#17120d,bold]%H:%M  "

# Message
set -g message-style "fg=#17120d,bg=#fff7ea"
set -g message-command-style "fg=#17120d,bg=#fff7ea"

# Mode (copy mode)
setw -g mode-style "fg=#f3eadc,bg=#0f6570"

# Bell
setw -g window-status-bell-style "fg=#f3eadc,bg=#842f24,bold"
