# Dreamcoder Light — Yazi theme
# Auto-generated from tokens.json — do not edit manually
# https://yazi-rs.github.io/docs/configuration/theme

[flavor]
dark = "dreamcoder-dark"
light = "dreamcoder-light"

[manager]
cwd = { fg = "#1e1813" }

# Hovered
hovered = { fg = "#1e1813", bg = "#f1d7c1" }
preview_hovered = { fg = "#1e1813", bg = "#ede9e3" }

# Find
find_keyword = { fg = "#753100", bold = true }
find_position = { fg = "#0a5b8f" }

# Marker
marker_copied = { fg = "#1b672f", bg = "#e3ddd5" }
marker_cut = { fg = "#9c2024", bg = "#e3ddd5" }
marker_selected = { fg = "#874004", bg = "#e3ddd5" }

# Tab
tab_active = { fg = "#1e1813", bg = "#f9f6f2" }
tab_inactive = { fg = "#5f544c", bg = "#ede9e3" }
tab_width = 2

# Count
count_copied = { fg = "#fefdfa", bg = "#1b672f" }
count_cut = { fg = "#fefdfa", bg = "#9c2024" }
count_selected = { fg = "#fefdfa", bg = "#874004" }

# Border
border_symbol = "│"
border_style = { fg = "#908379" }

# Highlight
syntect_theme = "Dreamcoder-Light"

[status]
separator_open = ""
separator_close = ""
progress_label = { fg = "#1e1813", bold = true }
progress_normal = { fg = "#874004" }
progress_error = { fg = "#9c2024" }

# Permissions
permissions_t = { fg = "#0a5b8f" }
permissions_r = { fg = "#1b672f" }
permissions_w = { fg = "#753100" }
permissions_x = { fg = "#9c2024" }
permissions_s = { fg = "#574894" }

[input]
border = { fg = "#874004" }
title = {}
value = {}
selected = { bg = "#f1d7c1" }

[select]
border = { fg = "#874004" }
active = { fg = "#753100" }
inactive = {}

[tasks]
border = { fg = "#874004" }
title = {}
hovered = { fg = "#1e1813", bg = "#f1d7c1" }

[which]
mask = { bg = "#e3ddd5" }
cand = { fg = "#0a5b8f" }
rest = { fg = "#5f544c" }
desc = { fg = "#2b241e" }
