[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta:__legacy__"

[project]
name = "dreamcoder-theme"
version = "0.1.0"
description = "Dreamcoder Workbench — health-first, terminal-native dotfiles with a token-governed theme engine"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Dreamcoder" }]
keywords = ["dotfiles", "theme", "arch-linux", "colorscheme", "hyprland"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Desktop Environment",
]
dependencies = ["jinja2>=3.0"]
[project.optional-dependencies]
dev = [
  "pytest>=7",
  "pytest-cov>=4",
  "ruff>=0.7",
  "mypy>=1.15",
  "jsonschema>=4",
  "types-jsonschema>=4",
  "jedi-language-server>=0.41",
]

[project.urls]
Homepage = "https://github.com/Gentleman-Programming/dreamcoder-dots"
Repository = "https://github.com/Gentleman-Programming/dreamcoder-dots"
Changelog = "https://github.com/Gentleman-Programming/dreamcoder-dots/blob/main/CHANGELOG.md"

[project.scripts]
dreamcoder-theme = "dreamcoder_theme.control:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["dreamcoder_theme*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "YTT", "ASYNC", "SIM", "PL", "RUF"]
ignore = [
  "E501",
  "PLR2004",
  "PLR0915",
  "UP022",
  "F841",
  "PLR0913",
  "RUF034",
  "PLR0917",
]

[tool.ruff.lint.per-file-ignores]
"scripts/verify-theme-health.py" = [
  "PLR2004",
  "SIM108",
  "PLR0912",
  "PLR0915",
  "PLC0415",
]
"scripts/generate-theme-preview.py" = ["PLR2004", "SIM108"]
"tests/test_*.py" = ["E402", "PLR2004", "N806", "PLW2901", "SIM108"]
"src/dreamcoder_theme/palette.py" = ["PLR0912", "PLR2004", "SIM102"]
"src/dreamcoder_theme/renderers_starship.py" = ["RUF001"]
"src/dreamcoder_theme/sync.py" = ["PLC0415"]
"src/dreamcoder_theme/renderers_extra_nvim_lsp.py" = ["PLR0913"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

# Mypy strict mode — Phase 2 will address all type errors
[tool.mypy]
python_version = "3.11"
strict = true
show_error_codes = true
warn_unreachable = true
ignore_missing_imports = false

[[tool.mypy.overrides]]
module = "PyQt6.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "matugen.*"
ignore_missing_imports = true

[tool.coverage.run]
source = ["src/dreamcoder_theme"]
relative_files = true

[tool.coverage.report]
show_missing = true
fail_under = 40

[dependency-groups]
dev = ["mypy>=2.1.0"]
